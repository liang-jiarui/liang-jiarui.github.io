<meta charset="utf-8">

<title>Observation Gallery · ObservationHub</title>
<style>
:root {
  --ink: #1b2e29;
  --muted: #5d7268;
  --paper: #eef2eb;
  --line: #d5e0d6;
  --teal: #0f6b54;
  --head: #f4f7f2;
  --zebra: #f8fbf8;
  --selected: #e5f3ec;
  --shadow: 0 10px 30px #16342f14;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a { touch-action: manipulation; }
a { color: var(--teal); }
:focus-visible { outline: 3px solid #7eae96; outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3, p, dl { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--muted); }
.mono, code, kbd, pre { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }

.masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: .5rem 1.25rem;
  padding: .75rem 1.25rem;
  border-bottom: 1px solid var(--line);
  background: #f7faf6;
}
.brand { display: flex; align-items: center; gap: .625rem; font-weight: 700; letter-spacing: -.02em; }
.mark { display: grid; place-items: center; width: 1.625rem; height: 1.625rem; flex: none; border-radius: 50%; background: var(--ink); color: #fff; line-height: 1; }
.quiet { color: var(--muted); font-size: .75rem; font-weight: 650; letter-spacing: .08em; }
.hubs, .tabs { display: flex; align-items: center; flex-wrap: wrap; gap: .375rem; }
.hubs a, .hubs .current, .tabs a { border-radius: 8px; padding: .375rem .625rem; font-size: .875rem; text-decoration: none; }
.hubs a, .tabs a { color: var(--muted); }
.hubs a:hover, .hubs .current { color: var(--teal); background: var(--selected); }
.hubs .current, .tabs a { font-weight: 650; }
main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .625rem; padding: .75rem 1rem; }
.tabs a { border: 1px solid transparent; padding-inline: .75rem; }
.tabs a[aria-current] { border-color: var(--line); background: #fff; color: var(--teal); }
.tabs a:hover { color: var(--teal); }
.tabs .count { margin-left: .375rem; font-variant-numeric: tabular-nums; font-size: .8125rem; font-weight: 500; }

.workspace {
  flex: 1;
  min-width: 0;
  display: flex;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  box-shadow: var(--shadow);
}
.filters { width: 13rem; flex: none; border-right: 1px solid var(--line); background: #fbfcf8; }
.filter-group + .filter-group { border-top: 1px solid var(--line); }
.filter-group { padding-bottom: .5rem; }
.treehead { padding: .8125rem .75rem .375rem; color: var(--muted); font-size: .8125rem; font-weight: 700; }
.filters button { width: 100%; border: 0; background: transparent; display: flex; justify-content: space-between; gap: .5rem; padding: .375rem .75rem; text-align: left; font-size: .875rem; }
.filters button:hover { background: #eef4ef; }
.filters button:focus-visible { outline-offset: -3px; }
.filters button[aria-pressed="true"] { background: var(--selected); box-shadow: inset 3px 0 0 var(--teal); font-weight: 650; }
.filter-count { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }
.sheet { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.toolbar { padding: .625rem .75rem .5rem; border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem .75rem; }
.bar h1 { font-size: 1.0625rem; letter-spacing: -.02em; }
.search { flex: 1; min-width: min(100%, 13rem); border: 1px solid #c9d6c8; border-radius: 8px; display: flex; align-items: center; gap: .5rem; padding: 0 .625rem; }
.search:focus-within { outline: 2px solid #7eae96; }
.search input { padding: .4375rem 0; width: 100%; min-width: 0; border: 0; outline: none; background: transparent; font-size: .875rem; }
kbd { padding: 0 .25rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); font-size: .8125rem; }
.ghost, .mini { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: .375rem .625rem; font-size: .875rem; }
.ghost:hover, .mini:hover { background: var(--selected); }
.resultbar { margin-top: .375rem; color: var(--muted); font-size: .875rem; }
.tablewrap { flex: 1; min-width: 0; max-height: max(20rem, calc(100dvh - 15rem)); overflow: auto; }
.tablewrap:focus-visible { outline-offset: -3px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .875rem; }
th, td { padding: .5rem .75rem; border-bottom: 1px solid #e4ece4; vertical-align: middle; text-align: left; }
thead th { position: sticky; top: 0; z-index: 1; white-space: nowrap; background: var(--head); color: var(--muted); font-size: .8125rem; border-bottom-color: #c9d7ca; }
tbody tr:nth-child(even) { background: var(--zebra); }
tbody tr:hover { background: #eef6f2; }
tbody tr:last-child td { border-bottom: 0; }
td:first-child { min-width: 13rem; }
td:nth-child(2), td:last-child { white-space: nowrap; }
td .title { font-weight: 650; text-decoration: none; }
td .title:hover { text-decoration: underline; }
td .mono { display: block; color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
.pill { display: inline-block; border-radius: 999px; background: #e5f2e8; color: #1d6b45; padding: .0625rem .5rem; font-size: .8125rem; }
.pill.secondary { background: #e7eef6; color: #2c5278; }
.pill.neutral { background: #eef1ec; color: #3e534a; }
.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); }
footer { display: flex; gap: 1rem; flex-wrap: wrap; padding-inline: .25rem; font-size: .875rem; color: var(--muted); }
dialog { width: min(calc(100% - 1.5rem), 54rem); max-height: 88dvh; border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; color: var(--ink); overflow: auto; }
dialog::backdrop { background: #0c251a70; }
.dialog-actions { display: flex; justify-content: space-between; gap: .75rem; align-items: center; margin-bottom: .75rem; }
dialog h2 { font-size: 1.375rem; line-height: 1.35; }
dialog h3 { font-size: .9375rem; margin: 1.125rem 0 .5rem; }
.description { margin-top: .5rem; }
.meta { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .375rem .875rem; margin-top: .875rem; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; overflow-wrap: anywhere; }
.links { margin: 0; padding-left: 1.25rem; }
.links li + li { margin-top: .25rem; }
.command { border: 1px solid var(--line); border-radius: 8px; background: #f7faf6; margin-top: .5rem; padding: .5rem .75rem; }
.command-label { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .375rem; font-size: .875rem; }
.command pre { margin: .5rem 0 .25rem; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .8125rem; }
#toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); max-width: calc(100% - 2rem); border-radius: 8px; background: var(--ink); color: #fff; padding: .5rem .75rem; font-size: .875rem; }
@media (min-width: 741px) {
  .workspace { flex: none; height: max(25rem, calc(100dvh - 8.75rem)); }
  .filters { overflow: auto; }
  .tablewrap { min-height: 0; max-height: none; }
}
@media (max-width: 740px) {
  .masthead { padding-inline: .875rem; }
  main { padding: .625rem .75rem; }
  .workspace { flex-direction: column; }
  .filters { width: auto; display: flex; border-right: 0; border-bottom: 1px solid var(--line); }
  .filter-group { flex: 1; min-width: 0; padding: .375rem .625rem .5rem; }
  .filter-group + .filter-group { border-top: 0; border-left: 1px solid var(--line); }
  .treehead { padding: .125rem 0 .3125rem; }
  .filter-options { display: flex; gap: .375rem; overflow: auto; }
  .filters button { width: auto; flex: none; white-space: nowrap; border: 1px solid var(--line); border-radius: 6px; padding: .25rem .5rem; }
  .filters button[aria-pressed="true"] { box-shadow: none; border-color: #8ab69c; }
  .tablewrap { max-height: 68vh; }
  td:nth-child(3), th:nth-child(3) { display: none; }
  kbd { display: none; }
}
@media (max-width: 480px) {
  .filters { display: block; }
  .filter-group + .filter-group { border-left: 0; border-top: 1px solid var(--line); }
  .search { order: 1; flex-basis: 100%; }
  .bar h1 { flex: 1; }
  th, td { padding-inline: .5rem; }
  td:first-child { min-width: 0; }
  td:last-child, th:last-child { display: none; }
  .meta { grid-template-columns: 1fr; gap: .125rem; }
  .meta dd + dt { margin-top: .375rem; }
}
</style>
</head>

<header class="masthead">

        </div>
        <p class="resultbar" id="result-count" aria-live="polite"></p>
      </div>
      <div id="tablewrap" class="tablewrap" tabindex="0" role="region" aria-label="Catalog results">
        <table>
          <caption class="sr" id="table-caption">Datasets</caption>
          <thead><tr><th scope="col" id="column-title">Dataset</th><th scope="col">Category</th><th scope="col" id="column-summary">Coverage</th><th scope="col" id="column-context">Storage</th></tr></thead>
          <tbody id="records"></tbody>
        </table>
      </div>
    </section>
  </div>
  <footer>
    <a href="https://github.com/liang-jiarui/ObservationHub">Guide</a>
    <a href="catalog.json">Catalog JSON</a>
  </footer>
</main>
<dialog id="detail" aria-labelledby="detail-title">
  <div class="dialog-actions">
    <span id="detail-kind" class="pill"></span>
    <button class="mini" id="close" type="button">Close</button>
  </div>
  <div id="detail-body"></div>
  <p id="toast" role="status" hidden></p>
</dialog>

        "station_validation.xlsx",
        "paired_stations.csv.gz",
        "metrics.csv",
        "evaluation.json"
      ],
      "requires": [
        "Set WRFGC_ARCHIVE to the directory of wrfout_d01 files on the same grid.",
        "Build a CNEMC daily station dataset for the simulation period."
      ]
    },
    {
      "id": "xu_2026_fire_2023",
      "title": "Xu 2026 Cross-Model Validation of China Wildfire Simulations",
      "category": "Cross-hub tasks",
      "description": "Use the same 2023 CNEMC monthly station dataset to validate EarthModelHub cases CESM/CAM e07 and E3SM/EAM e15 and e17. Each case's validation YAML references the case.yaml in its directory and reads the FireEarth history archive.",
      "datasets": [
        "cnemc_china"
      ],
      "commands": [
        {
          "label": "Prepare shared station dataset",
          "command": "observationhub build-stations --config config/stations/cnemc_2023_monthly.yaml"
        },
        {
          "label": "Validate a model case",
          "command": "observationhub validate --config \"$EMH_CASE_DIR\""
        }
      ],
      "links": [
        {
          "label": "EarthModelHub case configurations",
          "url": "https://github.com/liang-jiarui/EarthModelHub/tree/main/config/tasks/applications/xu_2026_fire_2023"
        }
      ],
      "outputs": [
        "output/validation/xu_2026_fire_2023/e07/",
        "output/validation/xu_2026_fire_2023/e15/",
        "output/validation/xu_2026_fire_2023/e17/"
      ],
      "requires": [
        "Set OBSERVATIONHUB_ROOT and FIREEARTH_ROOT.",
        "Set EMH_CASE_DIR to each configuration directory for e07, e15, and e17 and run validation separately."
      ],
      "upstream_tasks": [
        {
          "hub": "earthmodelhub",
          "id": "xu_2026_fire_2023",
          "url": "https://liang-jiarui.github.io/EarthModelHub/docs/simulations/?task=xu_2026_fire_2023"
        }
      ]
    },
    {
      "id": "xu_2026_common_stations",
      "title": "CAM and EAM Shared Station Sample Comparison",
      "category": "Cross-hub tasks",
      "description": "Select the sites and periods with valid model–observation pairs in all three cases, e07, e15, and e17. Recompute metrics for each model using the shared sample.",
      "datasets": [
        "cnemc_china"
      ],
      "commands": [
        {
          "label": "Generate shared sample workbook",
          "command": "observationhub compare-stations --output output/validation/xu_2026_fire_2023/common_station_comparison.xlsx output/validation/xu_2026_fire_2023/e07 output/validation/xu_2026_fire_2023/e15 output/validation/xu_2026_fire_2023/e17"
        }
      ],
      "links": [
        {
          "label": "Shared sample criteria",
          "url": "https://github.com/liang-jiarui/ObservationHub/blob/main/README.md#excel-%E4%B8%8E%E5%85%B1%E5%90%8C%E6%A0%B7%E6%9C%AC%E6%AF%94%E8%BE%83"
        }
      ],
      "outputs": [
        "output/validation/xu_2026_fire_2023/common_station_comparison.xlsx"
      ],
      "requires": [
        "Complete station validation for e07, e15, and e17."
      ],
      "upstream_tasks": [
        {
          "hub": "earthmodelhub",
          "id": "xu_2026_fire_2023",
          "url": "https://liang-jiarui.github.io/EarthModelHub/docs/simulations/?task=xu_2026_fire_2023"
        }
      ]
    }
  ],
  "hubs": [
    {
      "id": "observationhub",
      "label": "ObsHub",
      "url": "index.html"
    },
    {
      "id": "machinelearninghub",
      "label": "MLHub",
      "url": "https://liang-jiarui.github.io/MachineLearningHub/docs/gallery/"
    },
    {
      "id": "earthmodelhub",
      "label": "ModelHub",
      "url": "https://liang-jiarui.github.io/EarthModelHub/docs/simulations/"
    }
  ]
}</script>
<script>
"use strict";
const data = JSON.parse(document.querySelector("#catalog").textContent);
const byId = id => document.getElementById(id);
const detail = byId("detail");
const query = byId("query");
const views = {
  datasets: {title: "Datasets", item: "Dataset", index: new Map(data.datasets.map(row => [row.id, row]))},
  tasks: {title: "Tasks", item: "Task", index: new Map(data.tasks.map(row => [row.id, row]))},
};
const tasksByDataset = new Map();
for (const task of data.tasks) {
  for (const id of task.datasets) {
    if (!tasksByDataset.has(id)) tasksByDataset.set(id, []);
    tasksByDataset.get(id).push(task);
  }
}

function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value != null) node.textContent = value;
  if (className) node.className = className;
  return node;
}

function externalLink(label, url) {
  const parsed = new URL(url);
  if (parsed.protocol !== "https:" && parsed.protocol !== "http:") return element("span", label);
  const link = element("a", label);
  link.href = parsed.href;
  return link;
}

function getState() {
  const params = new URLSearchParams(location.search);
  const dataset = params.get("dataset");
  const task = params.get("task");
  const view = task || (!dataset && params.get("view") === "tasks") ? "tasks" : "datasets";
  return {view, open: task || dataset || "", q: params.get("q") || "", category: params.get("category") || "", kind: view === "datasets" ? params.get("kind") || "" : ""};
}

function stateUrl(state) {
  const url = new URL(location.href);
  url.search = "";
  if (state.open) url.searchParams.set(state.view === "tasks" ? "task" : "dataset", state.open);
  else if (state.view === "tasks") url.searchParams.set("view", state.view);
  for (const field of ["category", "kind", "q"]) {
    if (state[field]) url.searchParams.set(field, state[field]);
  }
  return url;
}

let state = getState();
let openKey = "";
let openRowId = "";
let copyTimer;
function navigate(next, replace = false) {
  const url = stateUrl(next);
  if (url.href !== location.href) {
    try {
      history[replace ? "replaceState" : "pushState"](null, "", url);
    } catch (error) {
      if (error.name !== "SecurityError") throw error;
      location.assign(url);
      return;
    }
  }
  state = next;
  render();
}

function internalLink(label, view, id, className) {
  const link = element("a", label, className);
  const next = state.view === view ? {...state, open: id} : {view, open: id};
  link.href = stateUrl(next);
  link.addEventListener("click", event => {
    if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    navigate(next);
  });
  return link;
}

for (const hub of data.hubs) {
  if (hub.id === data.hub) {
    const current = element("span", hub.label, "current");
    current.setAttribute("aria-current", "page");
    byId("hubs").append(current);
  } else {
    byId("hubs").append(externalLink(hub.label, hub.url));
  }
}
for (const view of Object.keys(views)) {
  byId(view + "-total").textContent = data[view].length;
  byId(view + "-tab").addEventListener("click", event => {
    if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    navigate({view});
  });
}

function refine(field, value) {
  navigate({...state, [field]: value, open: ""});
  const panel = byId(field === "category" ? "categories" : "kinds");
  panel.querySelector('[aria-pressed="true"]')?.focus({preventScroll: true});
}

function filterGroup(container, field, rows) {
  const counts = new Map();
  for (const row of rows) counts.set(row[field], (counts.get(row[field]) || 0) + 1);
  const options = [["", rows.length], ...counts];
  container.replaceChildren(...options.map(([value, count]) => {
    const option = element("button");
    option.type = "button";
    option.setAttribute("aria-pressed", String((state[field] || "") === value));
    option.append(element("span", value || "All"), element("span", count, "filter-count"));
    option.addEventListener("click", () => refine(field, value));
    return option;
  }));
}

function searchRows(rows) {
  const tokens = (state.q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
  return rows.filter(row => {
    const words = [row.title, row.id, row.category, row.publisher, row.coverage, row.kind, row.storage, row.description, row.path, row.config, ...(row.datasets || []), ...(row.upstream_tasks || []).map(item => item.id)].join(" ").toLowerCase();
    return tokens.every(token => words.includes(token));
  });
}

function renderRows(rows) {
  const isTask = state.view === "tasks";
  const records = rows.map(row => {
    const tr = element("tr");
    const title = element("td");
    const link = internalLink(row.title, state.view, row.id, "title");
    link.dataset.entryId = row.id;
    title.append(link, element("span", row.id, "mono"));
    const category = element("td");
    category.append(element("span", row.category, "pill"));
    const summary = element("td", isTask ? row.description : row.coverage || "—");
    const context = element("td");
    context.append(element("span", isTask ? row.datasets.length + (row.datasets.length === 1 ? " dataset" : " datasets") : row.storage, "pill " + (isTask ? "secondary" : "neutral")));
    tr.append(title, category, summary, context);
    return tr;
  });
  if (!records.length) {
    const row = element("tr");
    const cell = element("td", "No records match your filters.", "empty");
    cell.colSpan = 4;
    row.append(cell);
    records.push(row);
  }
  byId("records").replaceChildren(...records);
}

function listSection(parent, title, items) {
  if (!items.length) return;
  const list = element("ul", null, "links");
  for (const item of items) {
    const li = element("li");
    li.append(item);
    list.append(li);
  }
  parent.append(element("h3", title), list);
}

function metadata(parent, pairs) {
  const list = element("dl", null, "meta");
  for (const [label, value, isCode] of pairs) {
    if (!value) continue;
    const cell = element("dd");
    cell.append(element(isCode ? "code" : "span", value));
    list.append(element("dt", label), cell);
  }
  if (list.children.length) parent.append(list);
}

async function copy(value) {
  let copied = false;
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(value);
      copied = true;
    }
  } catch {}
  if (!copied) {
    const field = element("textarea");
    field.value = value;
    field.style.cssText = "position:fixed;opacity:0;pointer-events:none";
    const previous = document.activeElement;
    detail.append(field);
    field.select();
    copied = document.execCommand("copy");
    field.remove();
    previous?.focus();
  }
  const toast = byId("toast");
  toast.textContent = copied ? "Copied" : "Copy failed. Select and copy the text manually.";
  toast.hidden = false;
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { toast.hidden = true; }, 2200);
}

function renderDetail(row) {
  const body = byId("detail-body");
  const isTask = state.view === "tasks";
  byId("detail-kind").textContent = row.kind || row.category;
  byId("toast").hidden = true;
  const title = element("h2", row.title);
  title.id = "detail-title";
  body.replaceChildren(title, element("p", row.description, "description"));
  if (isTask) {
    metadata(body, [["Task ID", row.id, true], ["Configuration", row.config, true]]);
    listSection(body, "Input datasets", row.datasets.map(id => internalLink(views.datasets.index.get(id).title, "datasets", id)));
    listSection(body, "Related hub tasks", (row.upstream_tasks || []).map(item => externalLink((data.hubs.find(hub => hub.id === item.hub)?.label || item.hub) + " · " + item.id, item.url)));
    listSection(body, "Requirements", (row.requires || []).map(item => element("span", item)));
    if (row.commands.length) body.append(element("h3", "Commands"));
    for (const command of row.commands) {
      const box = element("div", null, "command");
      const label = element("div", null, "command-label");
      const button = element("button", "Copy", "mini");
      button.type = "button";
      button.setAttribute("aria-label", "Copy command for " + command.label);
      button.addEventListener("click", () => copy(command.command));
      label.append(element("strong", command.label), button);
      box.append(label, element("pre", command.command));
      body.append(box);
    }
    listSection(body, "Outputs", (row.outputs || []).map(item => element("code", item)));
  } else {
    metadata(body, [["Source ID", row.id, true], ["Publisher or archive", row.publisher], ["Coverage", row.coverage], ["Storage", row.storage], ["Repository path", row.path, true]]);
    listSection(body, "Related tasks", (tasksByDataset.get(row.id) || []).map(task => internalLink(task.title, "tasks", task.id)));
  }
  listSection(body, "Sources and documentation", row.links.map(link => externalLink(link.label, link.url)));
  const permalink = element("p");
  permalink.append(internalLink("Permalink", state.view, row.id));
  const button = element("button", "Copy link", "mini");
  button.type = "button";
  button.style.marginLeft = ".625rem";
  button.addEventListener("click", () => copy(stateUrl({view: state.view, open: row.id}).href));
  permalink.append(button);
  body.append(element("h3", "Share"), permalink);
}

function render() {
  const view = views[state.view];
  const isTask = state.view === "tasks";
  for (const name of Object.keys(views)) {
    const tab = byId(name + "-tab");
    if (name === state.view) tab.setAttribute("aria-current", "page");
    else tab.removeAttribute("aria-current");
  }
  byId("view-title").textContent = view.title;
  byId("table-caption").textContent = view.title;
  byId("column-title").textContent = view.item;
  byId("column-summary").textContent = isTask ? "Description" : "Coverage";
  byId("column-context").textContent = isTask ? "Input datasets" : "Storage";
  if (query.value !== (state.q || "")) query.value = state.q || "";
  const rows = data[state.view];
  const categoryRows = rows.filter(row => !state.kind || row.kind === state.kind);
  const kindRows = rows.filter(row => !state.category || row.category === state.category);
  filterGroup(byId("categories"), "category", categoryRows);
  byId("kind-group").hidden = isTask;
  if (!isTask) filterGroup(byId("kinds"), "kind", kindRows);
  const matching = searchRows(rows).filter(row => (!state.category || row.category === state.category) && (!state.kind || row.kind === state.kind));
  byId("result-count").textContent = matching.length + " of " + rows.length + " " + view.title.toLowerCase();
  renderRows(matching);
  const item = view.index.get(state.open);
  if (item) {
    const key = state.view + ":" + item.id;
    if (key !== openKey) {
      renderDetail(item);
      detail.scrollTop = 0;
      if (!detail.open) detail.showModal();
      else byId("close").focus({preventScroll: true});
    }
    openKey = key;
    openRowId = item.id;
  } else if (detail.open) {
    detail.close();
    const previous = Array.from(byId("records").querySelectorAll("a.title")).find(link => link.dataset.entryId === openRowId);
    (previous || query).focus({preventScroll: true});
    openKey = "";
    openRowId = "";
  }
}

query.addEventListener("input", () => navigate({...state, q: query.value, open: ""}, true));
byId("reset").addEventListener("click", () => navigate({view: state.view}));
byId("close").addEventListener("click", () => navigate({...state, open: ""}, true));
detail.addEventListener("cancel", event => {
  event.preventDefault();
  navigate({...state, open: ""}, true);
});
document.addEventListener("keydown", event => {
  if (event.key === "/" && !detail.open && !event.altKey && !event.ctrlKey && !event.metaKey &&
      !event.target.closest("input, textarea, select, [contenteditable]")) {
    event.preventDefault();
    query.focus();
  }
});
window.addEventListener("popstate", () => {
  state = getState();
  render();
});
render();
</script>
</body>
</html>
