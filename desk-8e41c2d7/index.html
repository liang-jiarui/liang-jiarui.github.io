<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f1f5f8">
  <title>Private Vault</title>
  <link rel="stylesheet" href="../assets/css/private-desk.css?v=3">
  <script type="module" src="../assets/js/private-desk.js?v=3"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Private Vault</span></div>
      <div class="top-actions" id="workspace-actions" hidden>
        <button class="button button-quiet" type="button" id="export">Export backup</button>
        <button class="button" type="button" id="lock">Lock</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="gate" id="gate" aria-labelledby="gate-title">
      <div class="gate-card">
        <div class="gate-icon" aria-hidden="true"></div>
        <h1 id="gate-title">Private Vault</h1>
        <p class="muted" id="gate-description">Checking this browser for a saved vault.</p>
        <noscript><p>Enable JavaScript to use the vault.</p></noscript>
        <form class="stack" id="gate-form" hidden>
          <label>Vault password
            <input id="password" type="password" required>
          </label>
          <label id="confirm-field" hidden>Confirm password
            <input id="confirm-password" type="password" autocomplete="new-password" disabled>
          </label>
          <button class="button button-primary" id="gate-submit" type="submit">Unlock</button>
        </form>
        <div class="status" id="gate-status" role="status" hidden></div>
        <div class="gate-footer" id="gate-footer" hidden>
          <button class="button button-quiet" id="restore" type="button">Restore from backup</button>
        </div>
      </div>
    </section>

    <section class="workspace" id="workspace" aria-labelledby="workspace-title" hidden>
      <div class="workspace-heading">
        <h1 id="workspace-title" tabindex="-1">Vault</h1>
        <p class="muted">Your files, links, and notes are encrypted and stored in this browser.</p>
      </div>
      <div class="status" id="workspace-status" role="status" hidden></div>
      <div class="desk-grid">
        <aside class="sidebar" aria-labelledby="folders-title">
          <div class="sidebar-heading"><h2 id="folders-title">Folders</h2></div>
          <ul class="folder-list" id="folder-list"></ul>
          <div class="folder-tools">
            <button class="button button-quiet" id="new-folder" type="button">New folder</button>
            <button class="button button-quiet" id="manage-folder" type="button" hidden>Manage folder</button>
          </div>
        </aside>

        <section class="content" aria-labelledby="list-title">
          <div class="toolbar">
            <label class="search"><span class="sr-only">Search links and files</span>
              <input id="search" type="search" placeholder="Search links and file names" autocomplete="off" spellcheck="false">
            </label>
            <div class="toolbar-actions">
              <button class="button" id="bulk-add" type="button">Bulk add</button>
              <button class="button button-primary" id="new-link" type="button">Add link</button>
              <button class="button button-primary" id="add-files" type="button">Add files</button>
            </div>
          </div>
          <div class="list-heading">
            <h2 id="list-title">All items</h2><span class="list-count" id="list-count" role="status"></span>
          </div>
          <ul class="link-list" id="link-list"></ul>
          <div class="empty-state" id="empty-state" hidden>
            <h3 id="empty-title"></h3>
            <p class="muted" id="empty-detail"></p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <dialog id="editor" aria-labelledby="dialog-title">
    <form class="stack" id="editor-form" autocomplete="off" spellcheck="false">
      <h2 id="dialog-title"></h2>
      <fieldset class="stack" id="link-fields" hidden disabled>
        <label>URL
          <input id="link-url" type="text" inputmode="url" autocomplete="off" maxlength="4096" placeholder="https://" required>
        </label>
        <label>Title
          <input id="link-title" type="text" maxlength="160" placeholder="Leave blank to use the website's domain">
        </label>
      </fieldset>
      <fieldset class="stack" id="bulk-fields" hidden disabled>
        <label>URLs
          <textarea id="bulk-urls" rows="7" placeholder="Paste one URL per line" required></textarea>
        </label>
      </fieldset>
      <fieldset class="stack file-picker" id="file-pick-fields" hidden disabled>
        <label>Local files
          <input id="local-files" type="file" multiple required aria-describedby="file-pick-help">
        </label>
        <p class="muted field-help" id="file-pick-help">Up to 25 MiB per file and 100 MiB of files per vault.</p>
      </fieldset>
      <fieldset class="stack" id="file-name-fields" hidden disabled>
        <label>File name
          <input id="file-name" type="text" maxlength="255" required>
        </label>
      </fieldset>
      <fieldset class="stack" id="assign-fields" hidden disabled>
        <label>Folder
          <select id="link-folder"></select>
        </label>
      </fieldset>
      <fieldset class="stack" id="note-fields" hidden disabled>
        <label>Notes
          <textarea id="link-note" rows="3" maxlength="1200"></textarea>
        </label>
      </fieldset>
      <fieldset class="stack" id="folder-fields" hidden disabled>
        <label>Folder name
          <input id="folder-name" type="text" maxlength="80" required>
        </label>
      </fieldset>
      <fieldset class="stack" id="restore-fields" hidden disabled>
        <label>Encrypted backup file
          <input id="backup-file" type="file" accept=".json,.vault,application/json" required>
        </label>
        <label>Backup password
          <input id="backup-password" type="password" autocomplete="current-password" required>
        </label>
      </fieldset>
      <p class="muted" id="dialog-detail" hidden></p>
      <div class="status status-error" id="dialog-status" role="status" hidden></div>
      <div class="dialog-actions">
        <button class="button button-danger" id="dialog-delete" type="button" hidden>Delete folder</button>
        <button class="button" id="dialog-cancel" type="button">Cancel</button>
        <button class="button button-primary" id="dialog-submit" type="submit">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
