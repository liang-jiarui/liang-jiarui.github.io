- title: Evolution of wildfire emissions and associated Earth system impacts
  title_zh: 野火排放演变及其地球系统影响
  years: 2025.08 – present
  years_zh: 2025.08 – 至今
  note: Quantify the atmospheric and climatic effects of global wildfire emissions with the Community Earth System Model (CESM).
  note_zh: 基于社区地球系统模式（CESM）量化全球野火排放的大气与气候效应。
  current: true
  tags:
    - CESM
    - Earth system modelling

- title: "Anthropogenic nitrous oxide emissions in China: trends, variations, and driving factors"
  title_zh: 中国人为源氧化亚氮排放：趋势、变化与驱动因素
  years: 2023.09 – present
  years_zh: 2023.09 – 至今
  note: Combine emission inventories and machine learning to quantify China’s anthropogenic N₂O emissions and explore mitigation pathways compatible with the 1.5 °C target.
  note_zh: 结合排放清单与机器学习，量化中国人为源 N₂O 排放，并探索与 1.5 °C 目标相容的减排路径。
  current: true
  tags:
    - Machine learning
    - Emission inventory

- title: Source–sink budgets and spatiotemporal patterns of carbon dioxide, methane, and nitrous oxide in China
  title_zh: 中国二氧化碳、甲烷与氧化亚氮源汇收支及时空格局
  years: 2024.12 – 2025.08
  years_zh: 2024.12 – 2025.08
  note: Ensemble analysis of greenhouse-gas source–sink budgets and spatial patterns in China, based on Global Carbon Project atmospheric inversions.
  note_zh: 基于全球碳计划大气反演，集合分析中国温室气体源汇收支与空间格局。
  current: false
  tags:
    - Atmospheric inversion
    - Greenhouse gases

- title: Source apportionment of summer ozone in Beijing with a machine learning–enhanced atmospheric chemical transport model
  title_zh: 机器学习增强的大气化学输送模式用于北京夏季臭氧来源解析
  years: 2022.07 – 2025.02
  years_zh: 2022.07 – 2025.02
  note: Build a GEOS-Chem and WRF-CAMx modelling framework, apply Ozone Source Apportionment Technology (OSAT), and complete an English manuscript.
  note_zh: 构建 GEOS-Chem 与 WRF-CAMx 模拟框架，应用臭氧来源解析技术（OSAT），并完成英文稿件。
  current: false
  tags:
    - GEOS-Chem
    - WRF-CAMx

- title: Operational optimization of industrial circulating water systems
  title_zh: 工业循环水系统运行优化
  years: 2021.09 – 2023.09
  years_zh: 2021.09 – 2023.09
  note: Develop a mixed-integer nonlinear optimization model for converter frequency and valve opening, solved with a genetic algorithm.
  note_zh: 建立变频器频率与阀门开度的混合整数非线性优化模型，并用遗传算法求解。
  current: false
  tags:
    - Optimization
    - Genetic algorithm
